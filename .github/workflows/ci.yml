name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Installing pnpm first is generally preferred to enable caching in setup-node
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          pip install -r requirements.txt
          pip install pip-audit

      # Blocking: fails CI only on advisories affecting shipped (production) dependencies.
      - name: Audit Node.js production dependencies
        run: pnpm audit --prod

      # Informational: transitive dev-tooling advisories (eslint, vite, tsx, …)
      # are surfaced but do not block unrelated PRs. Resolved via Dependabot
      # upgrades of the top-level dev dependencies.
      - name: Audit full Node.js dependency tree (informational)
        run: pnpm audit || true

      - name: Audit Python dependencies
        run: pip-audit -r requirements.txt

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test
